<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>각자의 프레임 — Gallery Archive</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- WebGL 셰이더 앰비언트 오로라 & 마우스 반응 빛 반사 배경 -->
  <canvas id="webglCanvas" class="webgl-canvas" aria-hidden="true"></canvas>

  <!-- 애플 스타일 슬림 1줄 글래스모피즘 상단 네비게이션 (브랜드 타이틀 + 폴더 탭 + 검색 + 새로고침 + 다크/라이트 토글) -->
  <header class="global-nav">
    <div class="nav-inner">
      <a href="#" class="nav-brand" id="btnResetFilter" aria-label="Gallery 홈">
        <svg class="brand-aperture" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="14.31" y1="8" x2="20.05" y2="17.94"></line>
          <line x1="9.69" y1="8" x2="21.17" y2="8"></line>
          <line x1="7.38" y1="12" x2="13.12" y2="2.06"></line>
          <line x1="9.69" y1="16" x2="3.95" y2="6.06"></line>
          <line x1="14.31" y1="16" x2="2.83" y2="16"></line>
          <line x1="16.62" y1="12" x2="10.88" y2="21.94"></line>
        </svg>
        <span class="brand-name">Gallery</span>
      </a>

      <!-- 중앙: 폴더 탭 (All / 공모전 1 / 공모전2) -->
      <nav id="folderCategoryTabs" class="nav-pills" role="tablist" aria-label="컬렉션 폴더 선택"></nav>

      <!-- 우측: 검색 + 새로고침(↻) + 다크/라이트 토글 (불필요한 폴더 아이콘 완전 제거) -->
      <div class="nav-actions">
        <div class="search-pill">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search" aria-label="사진 검색" />
        </div>

        <button type="button" id="btnRefreshGallery" class="nav-icon-btn" title="구글 드라이브 최신 목록 새로고침" aria-label="구글 드라이브 최신 목록 새로고침">
          <svg class="refresh-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>

        <button type="button" id="btnThemeToggle" class="nav-icon-btn" title="다크 / 라이트 모드 전환" aria-label="테마 전환">
          <svg id="iconSun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="iconMoon" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 상단 슬림 공지 배너 ([진행중] 폴더 감지 시 자동 활성화) -->
  <div id="ongoingBanner" class="ongoing-ribbon hidden" role="region" aria-label="진행 중인 공모전 안내">
    <button type="button" id="btnOngoingBanner" class="ongoing-ribbon-btn">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="ongoingBannerText" class="ongoing-ribbon-text">현재 [공모전] 진행 중입니다</span>
      <span class="ongoing-ribbon-cta">작품 보러가기 &rarr;</span>
    </button>
  </div>

  <!-- 미니멀 애플 키노트 스타일 히어로 -->
  <section class="hero-stage">
    <div class="hero-container">
      <p class="hero-eyebrow">Archive Exhibition</p>
      <h1 class="hero-title">각자의 프레임</h1>
      <p class="hero-subtitle">
        있는 그대로의 비율과 디테일로 기록된 컬렉션.<br />
        <span id="photoCountBadge" class="hero-count-inline">컬렉션 불러오는 중</span>
      </p>
    </div>
  </section>

  <!-- 메인 벤토 & 매거진 갤러리 영역 -->
  <main class="gallery-stage">
    <div class="gallery-container">
      <div id="statusBanner" class="status-banner hidden"></div>

      <!-- 비율 보존형 비대칭 벤토/매거진 그리드 -->
      <div id="photoGrid" class="bento-grid" aria-live="polite"></div>
    </div>
  </main>

  <!-- 애플식 스프링 전환 라이트박스 모달 -->
  <div id="lightboxModal" class="lightbox-root hidden" role="dialog" aria-modal="true" aria-label="사진 확대 보기">
    <div id="lightboxAmbientBg" class="lightbox-ambient"></div>

    <header class="lightbox-header">
      <div class="lightbox-meta">
        <span id="lightboxFolderTag" class="lightbox-folder-pill">Collection</span>
        <h2 id="lightboxTitle" class="lightbox-filename">Untitled</h2>
        <span id="lightboxResolution" class="lightbox-dimensions"></span>
      </div>

      <div class="lightbox-controls">
        <span id="lightboxCounter" class="lightbox-index">1 / 1</span>
        <button type="button" id="btnCloseLightbox" class="lightbox-close-btn" aria-label="닫기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="lightbox-viewport" id="lightboxStage">
      <button type="button" id="btnPrevPhoto" class="lightbox-arrow prev" aria-label="이전 사진">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="lightbox-figure-wrap">
        <div id="lightboxSpinner" class="lightbox-loader">
          <div class="apple-spinner"></div>
        </div>
        <img id="lightboxImage" class="lightbox-photo" src="" alt="" />
      </div>

      <button type="button" id="btnNextPhoto" class="lightbox-arrow next" aria-label="다음 사진">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- 하단 플로팅 글래스 필름스트립 독(Dock) -->
    <div class="lightbox-dock-wrap">
      <div id="lightboxFilmstrip" class="lightbox-dock"></div>
    </div>
  </div>

  <!-- 접속 및 새로고침(F5) 시 화면 정중앙 모달 팝업 ([진행중] 폴더 감지 시 표시) -->
  <div id="ongoingModalBackdrop" class="ongoing-modal-backdrop hidden" role="dialog" aria-labelledby="ongoingPopupTitle" aria-modal="true">
    <div id="ongoingPopup" class="ongoing-modal-card">
      <div class="ongoing-modal-badge-row">
        <span class="ongoing-live-badge">
          <span class="live-dot"></span>
          LIVE EXHIBITION
        </span>
      </div>
      <h3 id="ongoingPopupTitle" class="ongoing-modal-title">현재 2026 겨울 공모전 진행 중입니다</h3>
      <p id="ongoingPopupDesc" class="ongoing-modal-desc">
        지금 진행 중인 공모전의 최신 출품작들을 갤러리에서 바로 감상해 보세요.
      </p>
      <div class="ongoing-modal-actions">
        <button type="button" id="btnOngoingViewNow" class="ongoing-btn-primary">작품 보러가기</button>
        <button type="button" id="btnOngoingClose" class="ongoing-btn-secondary">닫기</button>
      </div>
    </div>
  </div>

  <!-- 애플 스타일 하단 반투명 글래스 토스트 알림 -->
  <div id="appleToast" class="apple-toast" role="status" aria-live="polite">
    <span class="toast-icon" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </span>
    <span id="appleToastText">최신 목록으로 업데이트되었습니다</span>
  </div>

  <footer class="minimal-footer">
    <div class="gallery-container footer-row">
      <span>각자의 프레임 — Gallery Archive</span>
      <span>Designed with Minimal Precision</span>
    </div>
  </footer>

  <!-- 구글 드라이브 폴더 주소 설정 파일 -->
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
